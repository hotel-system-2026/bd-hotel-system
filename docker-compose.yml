name: hotel_system_container-postgres-1

services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotel_system}
      POSTGRES_USER: ${POSTGRES_USER:-hotel_system_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel_system_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-hotel_system_user} -d ${POSTGRES_DB:-hotel_system}
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    build:
      context: .
      dockerfile: docker/liquibase/Dockerfile
    image: hotel-system-liquibase:5.0.2
    profiles:
      - tooling
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ./:/workspace
    entrypoint:
      - liquibase
      - --search-path=/workspace
      - --changeLogFile=changelog-master.yaml
      - --classpath=/liquibase/liquibase_libs/postgresql-42.7.8.jar
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hotel_system}
      - --username=${POSTGRES_USER:-hotel_system_user}
      - --password=${POSTGRES_PASSWORD:-hotel_system_password}

volumes:
  postgres_data:
