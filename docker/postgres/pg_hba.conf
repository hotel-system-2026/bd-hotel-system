# PostgreSQL client authentication configuration
# bootstrap_admin_socket: local socket only, no TCP
# ariel5253: TCP only

# TYPE  DATABASE        USER                    ADDRESS         METHOD

# Local socket access
local   hotel_system     hotel_system_user                       scram-sha-256

# TCP access for application user only
host    hotel_system     ariel5253               0.0.0.0/0       scram-sha-256
host    hotel_system     ariel5253               ::/0            scram-sha-256

# Explicitly deny bootstrap admin over TCP
host    hotel_system     hotel_system_user       0.0.0.0/0       reject
host    hotel_system     hotel_system_user       ::/0            reject

# Deny all other TCP connections
host    all              all                     0.0.0.0/0       reject
host    all              all                     ::/0            reject
